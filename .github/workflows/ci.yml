name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres 16, same as production/local — not sqlite. The app
    # uses django.contrib.postgres (SearchVectorField, GinIndex), which
    # doesn't exist on sqlite, so the test DB must be Postgres too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backend_devops_interview
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_devops_interview"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: backend_devops_interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Run smoke tests
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Validates the Dockerfile/entrypoint still produce a working image
        # on every PR. Not pushed anywhere — this is a build-correctness
        # check, not a deploy step.
        run: docker build -t backend-devops-interview:ci .